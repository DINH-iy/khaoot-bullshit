uot;route-setting&quot;&gt;&lt;span class=&quot;route-dot physical-dot&quot;&gt;&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Physical wins&lt;/strong&gt;&lt;span class=&quot;physical-destination&quot;&gt;Living Sculpture&lt;/span&gt;&lt;/div&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rejoin-note&quot;&gt;Both routes → &lt;span class=&quot;finale-destination&quot;&gt;Shared finale&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;other-settings&quot; hidden&gt;&lt;span class=&quot;tool-caption&quot;&gt;SCENE BEHAVIOR&lt;/span&gt;&lt;p class=&quot;scene-behavior&quot;&gt;Host-controlled presentation.&lt;/p&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;back-to-choice&quot;&gt;Select party choice&lt;/button&gt;&lt;/aside&gt;

&lt;style&gt;
#dual-editor-branching {color-scheme:light dark;}
#dual-editor-branching .builder {--e-bg:light-dark(#f7f7fa,#181a21);--e-panel:light-dark(#ffffff,#22252e);--e-ink:light-dark(#262b36,#eef0f5);--e-muted:light-dark(#656c7d,#b0b6c6);--e-line:light-dark(#e0e3eb,#3e4352);--e-accent:light-dark(#6844ca,#b9a2ff);--e-accent-ink:light-dark(#ffffff,#251645);--e-soft:light-dark(#f0eaff,#3a2d53);--e-grid:light-dark(#cbd0dd,#464b5a);--e-node:12px;--music:light-dark(#92610d,#edc76c);--music-soft:light-dark(#fff3d4,#42391e);--physical:light-dark(#1d776c,#82d2c2);--physical-soft:light-dark(#dcf4ee,#1c3936);font:13px/1.5 system-ui,sans-serif;background:var(--e-bg);color:var(--e-ink);border:1px solid var(--e-line);border-radius:15px;overflow:clip;}
#dual-editor-branching .builder * {box-sizing:border-box;}
#dual-editor-branching .builder p,#dual-editor-branching .builder h2 {margin:0;}
#dual-editor-branching .builder button,#dual-editor-branching .builder input,#dual-editor-branching .builder select {font:inherit;}
#dual-editor-branching .builder button,#dual-editor-branching .builder select {cursor:var(--cursor-interaction,pointer);}
#dual-editor-branching .builder button:focus-visible,#dual-editor-branching .builder input:focus-visible,#dual-editor-branching .builder select:focus-visible {outline:3px solid var(--e-accent);outline-offset:3px;}
#dual-editor-branching .appbar {display:flex;align-items:center;justify-content:space-between;gap:16px;padding:19px 22px;background:var(--e-panel);border-bottom:1px solid var(--e-line);}
#dual-editor-branching .brand {display:flex;gap:12px;align-items:center;min-width:0;}
#dual-editor-branching .brand-mark {display:grid;place-items:center;width:36px;height:36px;background:var(--e-ink);color:var(--e-panel);border-radius:10px;font:700 25px/1 Georgia,serif;}
#dual-editor-branching .brand strong {display:block;font-size:14px;}
#dual-editor-branching .subtle {display:block;font-size:11px;color:var(--e-muted);margin-top:2px;}
#dual-editor-branching .app-actions {display:flex;gap:15px;align-items:center;}
#dual-editor-branching .draft-pill {font-size:10px;color:var(--e-muted);letter-spacing:.08em;}
#dual-editor-branching .rehearse {background:var(--e-accent);color:var(--e-accent-ink);border:0;border-radius:7px;padding:9px 12px;font-size:12px;}
#dual-editor-branching .viewbar {padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--e-panel);border-bottom:1px solid var(--e-line);}
#dual-editor-branching .view-tabs {display:flex;padding:3px;background:var(--e-bg);border-radius:8px;gap:3px;}
#dual-editor-branching .view-tabs button {border:0;background:transparent;color:var(--e-muted);padding:7px 13px;border-radius:6px;font-size:12px;}
#dual-editor-branching .view-tabs [aria-selected=true] {background:var(--e-panel);color:var(--e-ink);box-shadow:0 1px 4px #00000012;font-weight:600;}
#dual-editor-branching .view-context {font-size:11px;color:var(--e-muted);}
#dual-editor-branching .editor-body {display:grid;grid-template-columns:minmax(0,1fr) 228px;}
#dual-editor-branching .main-editor {min-width:0;}
#dual-editor-branching [role=tabpanel] {min-height:578px;}
#dual-editor-branching [hidden] {display:none!important;}
#dual-editor-branching .flow-tools {padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
#dual-editor-branching .tool-caption {font-size:10px;letter-spacing:.09em;font-weight:650;color:var(--e-muted);}
#dual-editor-branching .flow-hint {font-size:11px;color:var(--e-muted);}
#dual-editor-branching .flow-canvas {position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,126px);gap:17px 25px;padding:20px;align-items:center;background-image:radial-gradient(var(--e-grid) .7px,transparent .7px);background-size:17px 17px;isolation:isolate;}
#dual-editor-branching .connections {position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:-1;pointer-events:none;}
#dual-editor-branching .edge-path {fill:none;stroke:var(--e-grid);stroke-width:1.6;marker-end:url(#branch-arrow);transition:stroke 160ms;}
#dual-editor-branching .edge-path.chosen {stroke:var(--e-accent);stroke-width:2.5;}
#dual-editor-branching .edge-path.not-chosen {opacity:.3;}
#dual-editor-branching .edge-label {font:11px system-ui,sans-serif;fill:var(--e-muted);paint-order:stroke;stroke:var(--e-bg);stroke-width:5px;stroke-linejoin:round;}
#dual-editor-branching .flow-node {position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;width:100%;min-height:125px;padding:12px 10px;border:1px solid var(--e-line);border-radius:var(--e-node);color:var(--e-ink);background:var(--e-panel);box-shadow:0 3px 8px #00000008;}

#dual-editor-branching .choice-type {color:var(--e-accent);}
#dual-editor-branching .opening {grid-column:1;grid-row:2;}

#dual-editor-branching .port {position:absolute;width:9px;height:9px;background:var(--e-panel);border:1.5px solid var(--e-muted);border-radius:50%;top:50%;transform:translateY(-50%);}
#dual-editor-branching .port.in {left:-5px;}
#dual-editor-branching .port.out {right:-5px;}
#dual-editor-branching .port.upper {top:34%;}
#dual-editor-branching .port.lower {top:71%;}
#dual-editor-branching .choice .port {border-color:var(--e-accent);}
#dual-editor-branching .flow-bottom {display:flex;justify-content:space-between;align-items:center;gap:12px;padding:19px 20px;font-size:11px;color:var(--e-muted);}
#dual-editor-branching .status-dot {display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--physical);margin-right:6px;}
#dual-editor-branching .edit-selected {padding:7px 10px;background:var(--e-panel);border:1px solid var(--e-line);border-radius:6px;color:var(--e-accent);font-size:11px;}
#dual-editor-branching .inspector {padding:20px 17px;background:var(--e-panel);border-left:1px solid var(--e-line);}
#dual-editor-branching .inspector-heading {display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:20px;}
#dual-editor-branching .inspector-type {font-size:10px;color:var(--e-accent);}
#dual-editor-branching .field {display:block;font-size:11px;color:var(--e-muted);margin:15px 0;}
#dual-editor-branching .field input,#dual-editor-branching .field select {display:block;width:100%;min-width:0;margin-top:6px;padding:8px 7px;font-size:11px;border:1px solid var(--e-line);border-radius:6px;color:var(--e-ink);background:var(--e-panel);}
#dual-editor-branching .field-pair {display:grid;grid-template-columns:1fr 1fr;gap:9px;}
#dual-editor-branching .field-pair .field {margin-top:0;}
#dual-editor-branching .settings-divider {height:1px;background:var(--e-line);margin:22px 0;}
#dual-editor-branching .route-setting {display:flex;align-items:center;gap:9px;padding:14px 0;border-bottom:1px solid var(--e-line);font-size:11px;}
#dual-editor-branching .route-setting&gt;div {flex:1;min-width:0;}
#dual-editor-branching .route-setting strong {display:block;font-weight:550;}
#dual-editor-branching .route-setting&gt;div&gt;span {display:block;color:var(--e-muted);margin-top:3px;overflow-wrap:anywhere;}
#dual-editor-branching .route-dot {width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
#dual-editor-branching .music-dot {background:var(--music);}
#dual-editor-branching .physical-dot {background:var(--physical);}
#dual-editor-branching .rejoin-note {font-size:11px;color:var(--e-muted);margin-top:15px;}
#dual-editor-branching .back-to-choice {margin-top:23px;padding:7px 9px;background:var(--e-bg);border:1px solid var(--e-line);border-radius:6px;font-size:11px;color:var(--e-ink);}
#dual-editor-branching .scene-behavior {font-size:12px;margin-top:12px!important;}
#dual-editor-branching .scene-workspace {display:grid;grid-template-columns:137px minmax(0,1fr);min-height:578px;}
#dual-editor-branching .slide-list {padding:14px 9px;background:var(--e-panel);border-right:1px solid var(--e-line);}

#dual-editor-branching .thumb-number {font-size:10px;color:var(--e-muted);width:12px;flex:0 0 auto;}
#dual-editor-branching .slide-thumb&gt;span:last-child {flex:1;min-width:0;}
#dual-editor-branching .mini-slide {display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;height:48px;font-size:9px;font-weight:750;line-height:1.3;letter-spacing:-.03em;text-align:center;border-radius:3px;}

#dual-editor-branching .intro-mini {background:var(--e-ink);color:var(--e-panel);}
#dual-editor-branching .choice-mini {background:var(--e-soft);color:var(--e-accent);border:1px solid var(--e-accent);}
#dual-editor-branching .music-mini {background:var(--music-soft);color:var(--music);}
#dual-editor-branching .physical-mini {background:var(--physical-soft);color:var(--physical);}
#dual-editor-branching .finale-mini {background:var(--e-soft);color:var(--e-accent);}
#dual-editor-branching .thumb-name {display:block;font-size:10px;font-weight:450;line-height:1.3;margin-top:5px;overflow-wrap:anywhere;}
#dual-editor-branching .branch-label {font-size:8px;color:var(--e-muted);letter-spacing:.03em;margin:12px 0 4px 20px;}
#dual-editor-branching .slide-workarea {padding:18px;min-width:0;}
#dual-editor-branching .slide-toolbar {display:flex;justify-content:space-between;align-items:center;gap:10px;}
#dual-editor-branching .device-tabs {display:flex;gap:2px;}

#dual-editor-branching .slide-stage {--g-accent:#c9b5ff;--g-bg:#231444;--g-ink:#faf6ff;--g-muted:#d1c1e7;--g-panel:#372255;--g-border:#695181;margin-top:24px;display:flex;justify-content:center;min-height:333px;align-items:center;}
#dual-editor-branching .presentation {background:var(--g-bg);color:var(--g-ink);border-radius:10px;width:100%;padding:18px;box-shadow:0 6px 15px #00000012;min-height:310px;display:flex;flex-direction:column;}
#dual-editor-branching .presentation-top {display:flex;justify-content:space-between;gap:12px;font-size:8px;letter-spacing:.08em;color:var(--g-muted);padding-bottom:16px;border-bottom:1px solid var(--g-border);}

#dual-editor-branching .option-icon {font-size:25px;line-height:1;color:var(--g-accent);}

#dual-editor-branching .rehearsal-bar {padding:15px 20px;border-top:1px solid var(--e-line);display:flex;flex-direction:column;gap:10px;background:var(--e-panel);}
