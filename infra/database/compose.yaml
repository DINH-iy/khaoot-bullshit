name: party-game-builder
services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: party_dev
      POSTGRES_USER: party_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:env first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_dev -d party_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  postgres-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: party_test
      POSTGRES_USER: party_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Run npm run db:env first}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql:size=512m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U party_test -d party_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
volumes:
  postgres_data:
